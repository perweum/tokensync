name: verify

# The same checks `npm run verify` runs locally (lint, format, typecheck, tests),
# plus the production build — on every push to main and every pull request,
# including stacked ones whose base isn't main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci

      - run: npm run verify

      - run: npm run build
